name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publier comme préversion"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_suffix: windows

          - os: macos-latest
            label: macOS (untested)
            artifact_suffix: macos-untested

          - os: ubuntu-latest
            label: Linux (untested)
            artifact_suffix: linux-untested

    env:
      NPM_CONFIG_ALLOW_GIT: all
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.x
          cache: npm

      - name: Show versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Setup Snapcraft
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo systemctl start snapd
          sudo snap install snapcraft --classic

      - name: Install NPM packages
        run: npm run npm:clean-install

      - name: Build NW.js application (Windows only)
        if: startsWith(matrix.os, 'windows')
        run: npm run bundle --workspace app/nw

      - name: Build Electron application
        run: npm run bundle --workspace app/electron

      - name: Upload NW.js builds as workflow artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: alternative-builds-${{ matrix.artifact_suffix }}
          path: app/nw/bundle/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload release builds
        uses: actions/upload-artifact@v4
        with:
          name: release-builds-${{ matrix.artifact_suffix }}
          path: app/electron/bundle/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare release information
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=HakuNeko Next v${VERSION}" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-builds-*
          path: artifacts
          merge-multiple: false

      - name: Normalize release asset names
        shell: bash
        run: |
          set -u

          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"

            case "$directory" in
              *macos-untested*)
                case "$filename" in
                  *arm64*|*ARM64*)
                    architecture="ARM64"
                    ;;
                  *x64*|*amd64*)
                    architecture="x64"
                    ;;
                  *)
                    echo "Skipping unrecognized macOS file: $file"
                    continue
                    ;;
                esac

                case "$filename" in
                  *.dmg)
                    extension="dmg"
                    ;;
                  *)
                    echo "Skipping non-DMG macOS file: $file"
                    continue
                    ;;
                esac

                target="HakuNeko-Next-v${VERSION}-macOS-${architecture}-UNTESTED.${extension}"
                ;;

              *linux-untested*)
                case "$filename" in
                  *arm64*|*ARM64*)
                    architecture="ARM64"
                    ;;
                  *x64*|*amd64*)
                    architecture="x64"
                    ;;
                  *)
                    architecture="x64"
                    ;;
                esac

                case "$filename" in
                  *.snap)
                    extension="snap"
                    ;;
                  *.AppImage|*.appimage)
                    extension="AppImage"
                    ;;
                  *.tar.gz)
                    extension="tar.gz"
                    ;;
                  *)
                    echo "Skipping Linux support file: $file"
                    continue
                    ;;
                esac

                target="HakuNeko-Next-v${VERSION}-Linux-${architecture}-UNTESTED.${extension}"
                ;;

              *windows*)
                continue
                ;;

              *)
                echo "Skipping file outside known artifact folders: $file"
                continue
                ;;
            esac

            target_path="$directory/$target"

            if [ "$file" = "$target_path" ]; then
              continue
            fi

            rm -f "$target_path"
            mv "$file" "$target_path"
            echo "Renamed: $filename -> $target"
          done < <(find artifacts -type f -print0)

          echo "Release assets after normalization:"
          find artifacts -type f -print

      - name: Verify release files
        shell: bash
        run: |
          mapfile -d '' RELEASE_FILES < <(
            find artifacts \
              -type f \
              \( \
                -iname '*.zip' \
                -o -iname '*.exe' \
                -o -iname '*.dmg' \
                -o -iname '*.snap' \
                -o -iname '*.appimage' \
                -o -iname '*.tar.gz' \
                -o -iname '*.7z' \
              \) \
              -print0
          )

          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release files were generated."
            exit 1
          fi

          echo "${#RELEASE_FILES[@]} release files found:"
          printf '%s\n' "${RELEASE_FILES[@]}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1
          then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_NAME"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi

      - name: Upload files to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' RELEASE_FILES < <(
            find artifacts \
              -type f \
              \( \
                -iname '*.zip' \
                -o -iname '*.exe' \
                -o -iname '*.dmg' \
                -o -iname '*.snap' \
                -o -iname '*.appimage' \
                -o -iname '*.tar.gz' \
                -o -iname '*.7z' \
              \) \
              -print0
          )

          gh release upload "$RELEASE_TAG" \
            "${RELEASE_FILES[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Show published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}"
