name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publier comme préversion"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_suffix: windows
          - os: macos-latest
            label: macOS (untested)
            artifact_suffix: macos-untested
          - os: ubuntu-latest
            label: Linux (untested)
            artifact_suffix: linux-untested

    env:
      NPM_CONFIG_ALLOW_GIT: all
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.x
          cache: npm

      - name: Setup Snapcraft
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo systemctl start snapd
          sudo snap install snapcraft --classic

      - name: Install NPM packages
        run: npm run npm:clean-install

      - name: Build NW.js application
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npm run bundle --workspace app/nw

      - name: Build Electron application
        run: npm run bundle --workspace app/electron

      - name: Upload NW.js builds as workflow artifacts
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        uses: actions/upload-artifact@v4
        with:
          name: alternative-builds-${{ matrix.artifact_suffix }}
          path: app/nw/bundle/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload release builds
        uses: actions/upload-artifact@v4
        with:
          name: release-builds-${{ matrix.artifact_suffix }}
          path: app/electron/bundle/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release information
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=HakuNeko Next v${VERSION}" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-builds-*
          path: artifacts
          merge-multiple: false

      - name: Normalize release asset names
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            extension="${filename##*.}"

            case "$directory" in
              *macos-untested*)
                architecture="$(echo "$filename" | grep -oE '(arm64|x64)' | tail -1)"
                [ "$architecture" = "arm64" ] && architecture="ARM64"
                target="HakuNeko-Next-v${VERSION}-macOS-${architecture}-UNTESTED.${extension}"
                ;;
              *linux-untested*)
                architecture="$(echo "$filename" | grep -oE '(arm64|x64|amd64)' | tail -1)"
                [ "$architecture" = "amd64" ] && architecture="x64"
                target="HakuNeko-Next-v${VERSION}-Linux-${architecture}-UNTESTED.${extension}"
                ;;
              *windows*)
                # Windows ZIP files are already named by bundle-app-zip.mjs.
                continue
                ;;
              *)
                continue
                ;;
            esac

            mv "$file" "$directory/$target"
          done < <(find artifacts -type f -print0)

          echo "Release assets:"
          find artifacts -type f -print

      - name: Verify release files
        shell: bash
        run: |
          mapfile -d '' RELEASE_FILES < <(
            find artifacts \
              -type f \
              \( \
                -iname '*.zip' \
                -o -iname '*.exe' \
                -o -iname '*.dmg' \
                -o -iname '*.snap' \
                -o -iname '*.appimage' \
                -o -iname '*.deb' \
                -o -iname '*.rpm' \
                -o -iname '*.tar.gz' \
                -o -iname '*.7z' \
              \) \
              -print0
          )

          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release files were generated."
            exit 1
          fi

          printf '%s\n' "${RELEASE_FILES[@]}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_NAME"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi

      - name: Upload files to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' RELEASE_FILES < <(
            find artifacts \
              -type f \
              \( \
                -iname '*.zip' \
                -o -iname '*.exe' \
                -o -iname '*.dmg' \
                -o -iname '*.snap' \
                -o -iname '*.appimage' \
                -o -iname '*.deb' \
                -o -iname '*.rpm' \
                -o -iname '*.tar.gz' \
                -o -iname '*.7z' \
              \) \
              -print0
          )

          gh release upload "$RELEASE_TAG" \
            "${RELEASE_FILES[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
